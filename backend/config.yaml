# Shared attempt-count convention:
# Every *_max_attempts value includes the initial attempt: 1 = no retry, 2 = one retry, 3 = two retries.
# Limits apply per operation, input window, scene, or audio segment, not to the entire import or playback.
# Expensive operations default to 2 attempts; short structured-response checks default to 3.
# Nested limits are independent: a content/validation attempt can use generation_max_attempts requests.
# Continuation attempts count the initial conversion and its follow-up requests, rather than failure retries.
# Restart the backend after changing this file.
gemini:
  # Shared across the four configurable safety categories for script generation, analysis, and TTS.
  # "OFF" / BLOCK_NONE / BLOCK_ONLY_HIGH / BLOCK_MEDIUM_AND_ABOVE / BLOCK_LOW_AND_ABOVE
  # Voice Design (POST /voices) has no corresponding safety setting.
  safety_threshold: BLOCK_NONE
  performance_review_max_attempts: 2 # Invalid performance-review or context-summary responses; also capped at 2 in code
  performance_review_max_output_tokens: 4096
  performance_context_window_max_characters: 24000
  source_voice_traits_max_attempts: 3 # Invalid source voice-trait response schemas or evidence references
  source_voice_traits_max_output_tokens: 4096
  analysis_max_attempts: 2 # Incomplete or invalid whole-work structured analysis
  generation_max_attempts: 2 # Shared text generation: transient errors, empty responses, or incomplete responses
  voice_design_max_attempts: 2 # Transient 502/503/504 on create/read; uncertain creation results are not retried
  retry_backoff_seconds: 3 # Base retry wait unit (seconds); grows in proportion to the attempt number
  connection_timeout_seconds: 300 # Upper bound for stream start and first-chunk receipt (seconds)
  chunk_timeout_seconds: 60 # Upper bound for the interval between chunks after the first chunk (seconds)
  processing_timeout_seconds: 1800 # Upper bound for the whole generative-AI processing including conversion and analysis (seconds)
  http_timeout_milliseconds: 1800000 # SDK HTTP timeout; stream and whole-processing deadlines also apply
  minimum_output_tokens: 1 # Common settings apply to Gemini 3.8 Flash and models without an override
  max_output_tokens: 65536
  max_main_characters: 6
  thinking_level: LOW # Gemini 3.8 Flash and Gemini 4 Argon support LOW/MEDIUM/HIGH
  import_continuation_max_attempts: 9 # Initial screenplay conversion plus continuation requests for long sources
  import_max_fountain_characters: 1000000
  text_reader_source_unit_max_characters: 24000
  text_reader_source_unit_overlap_characters: 3000
  pdf_classifier_page_window: 8
  pdf_reader_page_window: 6
  pdf_reader_page_overlap: 1
  reader_refinement_max_attempts: 2 # Invalid TXT reader results for an input window
  scene_regeneration_max_attempts: 2 # Scene writing; structure repairs and content revisions share the limit
  classification_max_output_tokens: 2048
  reader_max_output_tokens: 8192
  planning_max_output_tokens: 16384
  scene_writing_max_output_tokens: 16384
  verification_max_output_tokens: 4096
  verification_max_attempts: 3 # Invalid scene-verification JSON or evidence references; separate from scene rewriting
  model_overrides: # Selected by GEMINI_MODEL; omitted values inherit the common settings above
    gemini-4-argon:
      minimum_output_tokens: 32768 # Includes thinking; applies to every generation stage
      connection_timeout_seconds: 1200
      chunk_timeout_seconds: 1200
      http_timeout_milliseconds: 1200000

playback:
  tts_max_attempts: 2 # Audio-segment generation; failures after receiving audio are not retried
  scene_pause_duration_ms: 3000 # Silence before scene transitions and after headings; not before initial playback
  speaker_change_pause_duration_ms: 1000 # Silence for speaker changes, excluding scene headings; 0 disables it
  narrator_sentence_pause_duration_ms: 1000 # Narrator sentence-boundary silence, excluding commas and length splits; 0 disables it

emotion_arc:
  max_points: 36

sse:
  heartbeat_interval_seconds: 15
  poll_interval_milliseconds: 250

file_import:
  max_size_mb: 50
  pdf_max_pages: 1000
  fdx_max_depth: 64
  txt_minimum_confidence: 0.70
  draft_ttl_seconds: 3600

valence_search:
  similarity_threshold: 0.5 # Cosine similarity threshold (0.0-1.0); only documents at or above this value match in similarity search

valence_vectorization:
  algorithm: shape_slope_dct
  profile_revision: 2
  value_min: 1
  value_max: 7
  dimensions: 10
  canonical_points: 64
  interpolation: pchip
  dct_type: 2
  dct_norm: ortho
  slope_method: first_difference
  level_dimensions: 6
  slope_dimensions: 3
  level_weight: 0.7
  slope_weight: 0.3
  flat_range_epsilon: 0.5

valence_patterns:
  # Represent the 6 basic emotional arcs from Reagan et al. (2016) using only semantic control points from 1 to 7.
  - id: 'n'
    name: 'N (Rise-fall-rise)'
    control_values: [1, 7, 1, 7]
  - id: 'reverse_n'
    name: 'Reverse N (Fall-rise-fall)'
    control_values: [7, 1, 7, 1]
  - id: 'v'
    name: 'V (Fall-rise)'
    control_values: [7, 1, 7]
  - id: 'reverse_v'
    name: 'Reverse V (Rise-fall)'
    control_values: [1, 7, 1]
  - id: 'rise'
    name: 'Rise'
    control_values: [1, 7]
  - id: 'fall'
    name: 'Fall'
    control_values: [7, 1]
