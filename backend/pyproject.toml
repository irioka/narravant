[project]
name = "narravant"
version = "0.1.2"
description = "NARRAVANT development backend - audiobook workbench migration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "google-genai>=1.0.0",
    "jsonschema>=4.23.0",
    "cryptography>=46.0.3",
    "charset-normalizer>=3.5.1",
    "jinja2>=3.1.6",
    "numpy>=2.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.3",
    "pyjwt[crypto]>=2.9.0",
    "requests>=2.31.0",
    "scipy>=1.14.0",
    "sqlite-vec>=0.1.6",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narravant"]
