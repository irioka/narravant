name: Accessibility report
description: Tell us what's hard to use, read, or understand.
title: '[Accessibility] '
body:
- type: markdown
  attributes:
    value: 'Share whatever information you can. If this form is difficult to complete, a regular issue is welcome.
      Reports are public: do not include API keys, private manuscripts, or personal information.'
- type: textarea
  id: barrier
  attributes:
    label: Task and barrier
    description: Where did you get stuck? What did you expect to happen?
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: NARRAVANT version
    description: Add it if known.
  validations:
    required: false
- type: textarea
  id: environment
  attributes:
    label: Environment and assistive tools or devices
    description: Your OS, browser, and how you use the app, such as with a keyboard or screen reader, if known.
  validations:
    required: false
- type: textarea
  id: workaround
  attributes:
    label: Alternative methods or additional information
    description: Anything that works for you now, or steps that lead to the problem, if known.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Before posting
    options:
    - label: I have removed API keys, private manuscripts, actual voice IDs, and personal information.
      required: true
